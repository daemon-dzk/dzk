[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dzk"
version = "0.1.0"
description = "Personal security utility toolkit"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-magic>=0.4.27",
    "pyyaml>=6.0",
    "dnspython>=2.4.0",
    "requests>=2.31.0",
    "scapy>=2.5.0",
]

[project.scripts]
dzk = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[[project.authors]]
name = "daemon-dzk"
email = "12warbre@gmail.com"