[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dzk"
version = "0.1.0"
description = "Personal security utility toolkit"
authors = [{name = "daemon-dzk", email = ""}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-magic>=0.4.27",
    "pyyaml>=6.0",
]

[project.scripts]
dzk = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]